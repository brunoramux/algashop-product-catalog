server.port: 8083

spring:
  application:
    name: product-catalog
  cache:
    type: redis
  mongodb:
    uri: mongodb://root:algashop@localhost:27017/product_catalog?authSource=admin
    representation.uuid: standard
  data:
    redis:
      host: localhost
      port: 6379
      password: algashop
      database: 0
      timeout: 600
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://algashop-authorization-server:8081
          jwk-set-uri: http://algashop-authorization-server:8081/oauth2/jwks
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://localhost:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
      s3:
        enabled: true
        path-style-access-enabled: true

algashop:
  storage:
    s3:
      bucket-name: algashop-product-image
    images:
      base-url: http://localhost:4566/algashop-product-image

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

logging:
  level:
    org.mongodb.driver.protocol.command: DEBUG
    org.mongodb.driver.protocol.query: DEBUG
    org.mongodb.driver.connection: DEBUG